{% extends 'base.html' %}
{% block content %}
<h2>¿Borrar "{{ object.titulo }}"?</h2>
<p>Esta acción no se puede deshacer, ¿estás seguro que no querés comer más esto?</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">Sí, borrar</button>
<a href="{% url 'detalle_receta' object.pk %}" class="btn btn-secondary">No, volver</a>
</form>
{% endblock %}
