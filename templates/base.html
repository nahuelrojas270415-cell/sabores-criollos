<!DOCTYPE html>
<html>
<head>
    <title>Sabores Criollos - Recetas Argentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#fdf6ec}.navbar{background:#74acdf!important}</style>
</head>
<body>
<nav class="navbar navbar-dark mb-4"><div class="container">
<a class="navbar-brand fw-bold" href="/">🇦🇷 Sabores Criollos</a>
<div>
{% if user.is_authenticated %}
<a class="btn btn-light btn-sm" href="/receta/crear/">+ Nueva Receta</a>
<a class="btn btn-outline-light btn-sm" href="/accounts/logout/">Salir ({{user.username}})</a>
{% else %}
<a class="btn btn-light btn-sm" href="/accounts/login/">Entrar</a>
<a class="btn btn-warning btn-sm" href="/registro/">Registrarse</a>
{% endif %}
</div>
</div></nav>
<div class="container">{% block content %}{% endblock %}</div>
</body></html>
